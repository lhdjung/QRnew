name: Release

# **This is the only workflow that produces something a person can download and
# run**, and it now runs on `main` as well as on a tag. Workflow artifacts —
# what `build.yml` used to upload — are not that: they expire, they cannot be
# fetched without a GitHub account, and GitHub re-zips them, so what comes down
# is a `.zip` containing the `.app` bundle's insides rather than the bundle. A
# release asset is a plain URL that anybody can click.
#
# Two kinds of release come out of here, from one set of packaging steps,
# because the packaging is the part that is easy to get subtly wrong twice:
#
#   - a tag matching `v*` publishes a numbered release, which is the one the
#     README's Installation link points at;
#   - a push to `main` replaces a rolling `nightly` release with a build of the
#     commit that was just pushed.
#
# Both are marked `--latest`, which is the only thing the repository's front
# page reads: it shows the newest release that is neither a draft nor a
# prerelease, so a `nightly` marked prerelease left a four-month-old `v0.0.1`
# as the thing every visitor was sent to. Newest wins here, tag or `main`.
# The notes also carry the three download links, because GitHub collapses the
# assets list and a release whose body is prose looks like it has none.
#
# The rolling tag is deleted and recreated rather than moved, which is why the
# release is opened by a job of its own: three matrix jobs racing to create the
# same release is a coin flip, and one job creating it and three uploading into
# it is not. `nightly` does not match `v*`, and a tag pushed with `GITHUB_TOKEN`
# does not start a workflow anyway, so there is no loop here.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # The Flatpak repository is published to GitHub Pages, which wants both.
  pages: write
  id-token: write

# A second push to `main` while the first is still packaging would delete the
# release the first is uploading into. Tags are exempt from the cancelling:
# a numbered release interrupted halfway is a release with two of its three
# assets, and nothing says so afterwards.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  open:
    name: Open the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.what.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what this run publishes
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            # Re-running a tag's workflow should top up the release that is
            # already there rather than fail on the next line.
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --title "$tag" --latest --generate-notes
          else
            tag=nightly
            dl=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag
            # The .deb carries the crate version in its file name, so the link
            # has to be built from the same place the package takes it from.
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            {
              echo "### Download"
              echo
              echo "- [macOS]($dl/QRnew-macos.zip) — Apple silicon"
              echo "- [Windows]($dl/QRnew-windows.zip)"
              echo "- [Linux — Debian/Ubuntu/Pop!_OS]($dl/qrnew_${version}-1_amd64.deb)"
              echo "- [Linux — Flatpak](https://lhdjung.github.io/QRnew)"
              echo "- [Linux — portable]($dl/qrnew-linux.tar.gz)"
              echo
              echo "Built from \`main\` at commit \`${GITHUB_SHA:0:7}\`, and replaced by the next push to it. A link to this page is not a link to a fixed version; the numbered releases are."
              echo
              echo "Neither the macOS app nor the Windows executable is signed by a certificate your operating system has heard of, so both are refused on first launch. The README says which gesture each one wants."
            } > notes.md
            # The release first, which takes the tag with it, and then the tag
            # again in case a previous run left one without a release behind:
            # a stale tag would be reused, and the assets would be a build of
            # this commit hanging off a ref pointing at an older one.
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Development build" \
              --notes-file notes.md
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }}
    needs: open
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            asset: qrnew-linux.tar.gz target/debian/*.deb
          - name: macOS
            runner: macos-latest
            asset: QRnew-macos.zip
          - name: Windows
            runner: windows-latest
            asset: QRnew-windows.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `fontconfig` is what Parley finds fonts through, and it is linked
      # rather than dlopened, so the build stops without its headers. GTK is
      # not here any more: the file dialogs went from libcosmic to `rfd`, which
      # asks the desktop portal over D-Bus and links nothing.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libfontconfig1-dev

      # The Linux packaging is three `just` recipes rather than a second copy
      # of them here, because the copy is what drifted last time: the workflow
      # shipped a desktop entry named `dev.lhdjung.QrNew` while the icon went in
      # under `dev.lhdjung.QRnew`, and nothing failed, the icon just never
      # appeared. macOS and Windows are still inline below.
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deb

      - run: cargo build --release --locked

      - name: Validate the desktop entry and metainfo (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y desktop-file-utils appstream
          just check-metadata

      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # The bundle's version comes from `Cargo.toml`, which is the one copy
          # of it `cargo` actually builds against. It used to be typed into the
          # plist below and into the `justfile`, so a tag that bumped the crate
          # shipped an app still calling itself whatever was written here last.
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          rm -rf QRnew.app
          mkdir -p QRnew.app/Contents/MacOS QRnew.app/Contents/Resources
          cp target/release/qrnew QRnew.app/Contents/MacOS/qrnew
          icon=resources/icons/hicolor/scalable/apps/icon.svg
          iconset=/tmp/QRnew_$$.iconset
          mkdir "$iconset"
          for size in 16 32 128 256 512; do
            magick "$icon" -background none -resize "${size}x${size}"     "$iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            magick "$icon" -background none -resize "${double}x${double}" "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns -o QRnew.app/Contents/Resources/AppIcon.icns "$iconset"
          rm -rf "$iconset"
          cat > QRnew.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleName</key><string>QRnew</string>
          <key>CFBundleDisplayName</key><string>QRnew</string>
          <key>CFBundleIdentifier</key><string>dev.lhdjung.QRnew</string>
          <key>CFBundleVersion</key><string>${version}</string>
          <key>CFBundleShortVersionString</key><string>${version}</string>
          <key>CFBundleExecutable</key><string>qrnew</string>
          <key>CFBundleIconFile</key><string>AppIcon</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - QRnew.app
          ditto -c -k --keepParent QRnew.app QRnew-macos.zip

      # `--no-build` on the deb: the release binary is already built above, and
      # cargo-deb would otherwise build it a second time without the profile.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          just tarball-linux
          just deb

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p QRnew-windows
          cp target/release/qrnew.exe QRnew-windows/QRnew.exe
          icon=resources/icons/hicolor/scalable/apps/icon.svg
          tmpdir=$(mktemp -d)
          for size in 16 32 48 64 128 256; do
            magick "$icon" -background none -resize "${size}x${size}" "$tmpdir/icon_${size}.png"
          done
          magick "$tmpdir/icon_16.png" "$tmpdir/icon_32.png" "$tmpdir/icon_48.png" \
            "$tmpdir/icon_64.png" "$tmpdir/icon_128.png" "$tmpdir/icon_256.png" \
            QRnew-windows/QRnew.ico
          rm -rf "$tmpdir"
          7z a QRnew-windows.zip QRnew-windows/

      # `--clobber` rather than a plain upload, because a re-run of a tag's
      # workflow lands on a release that already has the asset.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Unquoted on purpose: Linux's entry is two paths, one of them a glob.
        run: gh release upload "${{ needs.open.outputs.tag }}" ${{ matrix.asset }} --clobber

  # The Flatpak is not on Flathub — their generative-AI policy, see
  # packaging/flatpak/README.md — so the repository is ours and lives on GitHub
  # Pages. One click installs it and `flatpak update` keeps it current, which is
  # the part a downloadable bundle cannot do.
  flatpak:
    name: Flatpak
    needs: open
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install the runtime and SDK
        run: |
          version=$(sed -n "s/^runtime-version: '\(.*\)'/\1/p" packaging/flatpak/dev.lhdjung.QRnew.yml)
          flatpak install -y --user --noninteractive flathub \
            "org.freedesktop.Platform//$version" \
            "org.freedesktop.Sdk//$version" \
            "org.freedesktop.Sdk.Extension.rust-stable//$version"

      # The manifest tracks `main`; a tagged release has to build the tag, or
      # the numbered release would contain whatever main happened to be at.
      - name: Build the tag rather than main
        if: github.ref_type == 'tag'
        run: |
          sed -i "s|branch: main|tag: ${GITHUB_REF_NAME}|" packaging/flatpak/dev.lhdjung.QRnew.yml

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY is unset. Run 'just flatpak-keygen' and add the two secrets it prints."
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      # --disable-rofiles-fuse: the runners have no FUSE for it to use.
      - name: Build and sign
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          flatpak-builder \
            --repo=repo \
            --default-branch=stable \
            --force-clean \
            --disable-rofiles-fuse \
            --gpg-sign="$GPG_KEY_ID" \
            builddir packaging/flatpak/dev.lhdjung.QRnew.yml

      - name: Export the single-file bundle
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          flatpak build-bundle repo QRnew.flatpak dev.lhdjung.QRnew stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            --gpg-sign="$GPG_KEY_ID"

      # `.flatpakref` is the one-click install; `.flatpakrepo` adds the remote
      # by hand. Both carry the public key inline, so neither needs a separate
      # download and neither install has to pass --no-gpg-verify.
      - name: Write the repository metadata and landing page
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          PAGES_URL: https://lhdjung.github.io/QRnew
        run: |
          gpg --export "$GPG_KEY_ID" > repo/qrnew.gpg
          key=$(base64 -w0 repo/qrnew.gpg)
          cp resources/icons/hicolor/scalable/apps/icon.svg repo/icon.svg

          cat > repo/qrnew.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=QRnew
          Url=${PAGES_URL}
          Homepage=https://github.com/lhdjung/QRnew
          Comment=Local-only QR code generator
          Description=Self-hosted Flatpak repository for QRnew
          Icon=${PAGES_URL}/icon.svg
          GPGKey=${key}
          EOF

          cat > repo/qrnew.flatpakref <<EOF
          [Flatpak Ref]
          Title=QRnew
          Name=dev.lhdjung.QRnew
          Branch=stable
          Url=${PAGES_URL}
          Homepage=https://github.com/lhdjung/QRnew
          Comment=Local-only QR code generator
          Icon=${PAGES_URL}/icon.svg
          IsRuntime=false
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          GPGKey=${key}
          EOF

          cat > repo/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>QRnew</title>
          <style>
            :root { color-scheme: light dark; }
            body { font: 16px/1.6 system-ui, sans-serif; max-width: 40rem;
                   margin: 4rem auto; padding: 0 1.5rem; }
            pre { background: rgba(128,128,128,.15); padding: 1rem;
                  border-radius: .5rem; overflow-x: auto; }
            a.button { display: inline-block; padding: .7rem 1.4rem; background: #2b7de9;
                       color: #fff; border-radius: .5rem; text-decoration: none;
                       font-weight: 600; }
          </style>
          <h1>QRnew</h1>
          <p>A local-only QR code generator. This page is its Flatpak repository.</p>
          <p><a class="button" href="qrnew.flatpakref">Install QRnew</a></p>
          <p>If your browser saves the file instead of opening it, double-click the
             downloaded <code>qrnew.flatpakref</code>.</p>
          <h2>Or from a terminal</h2>
          <pre>flatpak remote-add --if-not-exists --user qrnew ${PAGES_URL}/qrnew.flatpakrepo
          flatpak install --user qrnew dev.lhdjung.QRnew</pre>
          <p>Either way, <code>flatpak update</code> keeps it current.</p>
          <p><a href="https://github.com/lhdjung/QRnew">Source code</a></p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Publish the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.open.outputs.tag }}" QRnew.flatpak --clobber

  pages:
    name: Publish the Flatpak repository
    needs: flatpak
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Release

# **This is the only workflow that produces something a person can download and
# run**, and it now runs on `main` as well as on a tag. Workflow artifacts —
# what `build.yml` used to upload — are not that: they expire, they cannot be
# fetched without a GitHub account, and GitHub re-zips them, so what comes down
# is a `.zip` containing the `.app` bundle's insides rather than the bundle. A
# release asset is a plain URL that anybody can click.
#
# Two kinds of release come out of here, from one set of packaging steps,
# because the packaging is the part that is easy to get subtly wrong twice:
#
#   - a tag matching `v*` publishes a numbered release, which is the one the
#     README's Installation link points at;
#   - a push to `main` replaces a rolling `nightly` release with a build of the
#     commit that was just pushed.
#
# Both are marked `--latest`, which is the only thing the repository's front
# page reads: it shows the newest release that is neither a draft nor a
# prerelease, so a `nightly` marked prerelease left a four-month-old `v0.0.1`
# as the thing every visitor was sent to. Newest wins here, tag or `main`.
# The notes also carry the three download links, because GitHub collapses the
# assets list and a release whose body is prose looks like it has none.
#
# The rolling tag is deleted and recreated rather than moved, which is why the
# release is opened by a job of its own: three matrix jobs racing to create the
# same release is a coin flip, and one job creating it and three uploading into
# it is not. `nightly` does not match `v*`, and a tag pushed with `GITHUB_TOKEN`
# does not start a workflow anyway, so there is no loop here.
#
# The macOS and Windows packages are built by `just bundle-macos` and
# `just bundle-windows`, which is where those steps used to be written out a
# second time. One copy: what a release ships is what `just` builds on a
# laptop.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# A second push to `main` while the first is still packaging would delete the
# release the first is uploading into. Tags are exempt from the cancelling:
# a numbered release interrupted halfway is a release with two of its three
# assets, and nothing says so afterwards.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  open:
    name: Open the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.what.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what this run publishes
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            # Re-running a tag's workflow should top up the release that is
            # already there rather than fail on the next line.
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --title "$tag" --latest --generate-notes
          else
            tag=nightly
            dl=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag
            {
              echo "### Download"
              echo
              echo "- [macOS]($dl/QRnew-macos.zip) — Apple silicon"
              echo "- [Windows]($dl/QRnew-windows.zip)"
              echo "- [Linux]($dl/qrnew-linux.tar.gz)"
              echo
              echo "Built from \`main\` at commit \`${GITHUB_SHA:0:7}\`, and replaced by the next push to it. A link to this page is not a link to a fixed version; the numbered releases are."
              echo
              echo "Neither the macOS app nor the Windows executable is signed by a certificate your operating system has heard of, so both are refused on first launch. The README says which gesture each one wants."
            } > notes.md
            # The release first, which takes the tag with it, and then the tag
            # again in case a previous run left one without a release behind:
            # a stale tag would be reused, and the assets would be a build of
            # this commit hanging off a ref pointing at an older one.
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Development build" \
              --notes-file notes.md
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }}
    needs: open
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            asset: qrnew-linux.tar.gz
          - name: macOS
            runner: macos-latest
            asset: QRnew-macos.zip
          - name: Windows
            runner: windows-latest
            asset: QRnew-windows.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: extractions/setup-just@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `fontconfig` is what Parley finds fonts through, and it is linked
      # rather than dlopened, so the build stops without its headers. GTK is
      # not here any more: the file dialogs went from libcosmic to `rfd`, which
      # asks the desktop portal over D-Bus and links nothing.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libfontconfig1-dev

      - run: cargo build --release --locked

      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick

      # The bundle recipes are the justfile's, so a release ships what `just`
      # builds on a laptop. They take the version from `Cargo.toml`, which is
      # the one copy `cargo` builds against.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: just bundle-macos

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir qrnew-linux
          cp target/release/qrnew                                   qrnew-linux/qrnew
          cp resources/app.desktop                                   qrnew-linux/dev.lhdjung.QRnew.desktop
          cp resources/icons/hicolor/scalable/apps/icon.svg          qrnew-linux/dev.lhdjung.QRnew.svg
          tar czf qrnew-linux.tar.gz qrnew-linux/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          just bundle-windows
          7z a QRnew-windows.zip QRnew-windows/

      # `--clobber` rather than a plain upload, because a re-run of a tag's
      # workflow lands on a release that already has the asset.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.open.outputs.tag }}" "${{ matrix.asset }}" --clobber
